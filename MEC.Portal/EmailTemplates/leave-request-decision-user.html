<div style="font-family: Arial, sans-serif; color: #18285c; line-height: 1.6;">
  <h2 style="margin-bottom: 12px;">İzin talebiniz {{DecisionLabel}}</h2>
  <p>Merhaba {{EmployeeName}},</p>
  <p>{{DateRange}} tarih aralığındaki izin talebiniz {{DecisionAuthority}} adına {{DecisionBy}} tarafından {{DecisionAction}}.</p>
  <p><strong>Açıklama</strong></p>
  <div style="padding: 14px; border: 1px solid #d9e2f2; border-radius: 12px; background: #f8fbff;">{{ReasonHtml}}</div>
  <p style="margin-top: 20px;">
    Talep detayını görüntülemek için
    <a href="{{RequestUrl}}" style="color: #0d6efd; font-weight: 700;">buraya tıklayın</a>.
  </p>
</div>
